---
# Azure Pipelines configuration for Web App Service deployment
# This replaces the OpenShift-based deployment

trigger:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  containerRegistry: 'acr0ct0hub0weu0pas.azurecr.io'
  containerRegistryName: 'acr0ct0hub0weu0pas'
  imageName: 'qa-testgen-interactive-dashboard'
  dockerfilePath: '$(Build.SourcesDirectory)/src/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)/src'

stages:
  - stage: Build
    displayName: 'Build and Push Image'
    jobs:
      - job: BuildImage
        displayName: 'Build Docker Image'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '3.x'
            displayName: 'Use .NET Core sdk'

          - task: Docker@2
            displayName: 'Build and Push Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageName)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: 'AzureContainerRegistry'
              tags: |
                $(Build.BuildId)
                latest
              arguments: '--build-arg DEBIAN_FRONTEND=noninteractive'

  - stage: DeployToWebApp
    displayName: 'Deploy to Web App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy to Azure Web App'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Configure Web App Container'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      
                      WEBAPP_NAME="qa-testgen-dashboard"
                      RESOURCE_GROUP="rg-qa-testgen"
                      IMAGE_URL="$(containerRegistry)/$(imageName):$(Build.BuildId)"
                      
                      echo "Configuring Web App: $WEBAPP_NAME"
                      echo "Image: $IMAGE_URL"
                      
                      az webapp config container set \
                        --name "$WEBAPP_NAME" \
                        --resource-group "$RESOURCE_GROUP" \
                        --docker-custom-image-name "$IMAGE_URL" \
                        --docker-registry-server-url "https://$(containerRegistry)" \
                        --docker-registry-server-user "$(registryUsername)" \
                        --docker-registry-server-password "$(registryPassword)"
                      
                      echo "Restarting Web App..."
                      az webapp restart \
                        --name "$WEBAPP_NAME" \
                        --resource-group "$RESOURCE_GROUP"
                      
                      echo "Deployment completed!"
                      echo "Web App URL: https://$WEBAPP_NAME.azurewebsites.net"

                - task: AzureCLI@2
                  displayName: 'Verify Deployment'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      WEBAPP_NAME="qa-testgen-dashboard"
                      RESOURCE_GROUP="rg-qa-testgen"
                      
                      echo "Checking Web App status..."
                      az webapp show \
                        --name "$WEBAPP_NAME" \
                        --resource-group "$RESOURCE_GROUP" \
                        --query "state"
